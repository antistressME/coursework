[tool.poetry]
name = "pyproject-toml"
version = "0.1.0"
description = ""
authors = ["Anastasia <antipinaanastasia0112@gmail.com>"]
readme = "README.md"
packages = [{include = "pyproject"}]

[tool.poetry.dependencies]
python = "^3.12"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.1.2"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
pytest = "^8.3.5"
mock = "^5.2.0"
patch = "^1.16"
jinja2 = "^3.1.6"
requests = "^2.32.5"
dotenv = "^0.9.9"
freezegun = "^1.5.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''
[tool.isort]
line_length = 119
